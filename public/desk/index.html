<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Nook Curtains staff desk"><meta name="robots" content="noindex,nofollow"><style>.top .brand{display:flex;flex-direction:row;align-items:center;gap:10px}.top .brand .bt{display:flex;flex-direction:column;line-height:1.1}.top .brand img{height:40px;width:auto;border:2px solid #fff;border-radius:4px;background:#fff;display:block}</style><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nook Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: master-detail staff desk. Job list on the left, the open job sheet on the right.
   A pleated header band echoes curtain folds; the stage stepper mirrors Nook's own process
   (appointment, free estimate, fabric and confirm, installation). */
:root{
  --bg:#EBEEEB; --surface:#F7F9F7; --raised:#FFFFFF; --ink:#18262A; --muted:#566669; --line:#D3D9D5;
  --accent:#1B5B58; --accent-ink:#FFFFFF; --accent-soft:#DCEBE8; --danger:#A4382F; --ok:#2E7A3E;
  --s-enquiry:#5F6F72; --s-measure:#A8680F; --s-quoted:#2B5FAE; --s-confirmed:#1B6F66;
  --s-install:#7A4EA3; --s-done:#3A7D44; --s-lost:#A4382F;
  --f-display:'Familjen Grotesk',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1819; --surface:#162123; --raised:#1C2A2D; --ink:#E4ECEA; --muted:#93A5A6; --line:#2B3C3F;
    --accent:#5FB8AF; --accent-ink:#0C1F1E; --accent-soft:#1F3A3A; --danger:#E27C72; --ok:#6CC17A;
    --s-enquiry:#8FA0A3; --s-measure:#E0A04A; --s-quoted:#7FA8EA; --s-confirmed:#5FC2B3;
    --s-install:#BC95E3; --s-done:#7FCB8B; --s-lost:#E27C72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1819; --surface:#162123; --raised:#1C2A2D; --ink:#E4ECEA; --muted:#93A5A6; --line:#2B3C3F;
  --accent:#5FB8AF; --accent-ink:#0C1F1E; --accent-soft:#1F3A3A; --danger:#E27C72; --ok:#6CC17A;
  --s-enquiry:#8FA0A3; --s-measure:#E0A04A; --s-quoted:#7FA8EA; --s-confirmed:#5FC2B3;
  --s-install:#BC95E3; --s-done:#7FCB8B; --s-lost:#E27C72;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* header */
.top{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 13px,rgba(0,0,0,.12) 13px 26px),var(--accent);color:var(--accent-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.01em}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tabs button{background:transparent;border:0;border-radius:6px;padding:8px 12px;font-weight:600;color:inherit;opacity:.8}
.tabs button[aria-selected="true"]{background:var(--accent-ink);color:var(--accent);opacity:1}
.savestate{font-size:12px;opacity:.9;font-family:var(--f-mono)}
.signbar{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 12px;border-radius:6px;line-height:1.45}
.signbar.warn{border-left-color:#B8741A}
/* phones: name and buttons on the first row, the three tabs share the second row */
@media (max-width:760px){
  .top .wrap{gap:8px 10px;padding-block:8px}
  .top .brand{flex:1 1 auto;min-width:0}
  .top .brand b{font-size:17px;white-space:nowrap}
  .top .nook-hb{order:2;flex:0 0 auto}
  .tabs{order:3;flex:1 0 100%;gap:6px}
  .tabs button{flex:1 1 0;min-width:0;padding:9px 4px;font-size:14px;text-align:center;white-space:nowrap}
  .savestate{order:4;flex:1 0 100%;font-size:11px}
  .savestate:empty,.savestate[data-s="saving"],.savestate[data-s="saved"],.savestate[data-s="idle"]{display:none}
}

main{padding-block:16px 28px}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.banner.err{border-color:var(--danger);color:var(--danger)}

/* split */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.split{grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start}}
@media (max-width:899px){body.open-detail .list-pane{display:none}body:not(.open-detail) .detail-pane{display:none}}
.list-pane{display:flex;flex-direction:column;gap:10px;min-width:0}
.toolbar{display:flex;gap:8px}
.toolbar input{flex:1;min-width:0}
input,select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:600;white-space:nowrap;width:auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);margin-left:4px;font-weight:400}
.jobs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.job{display:grid;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.job[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.job .r1{display:flex;justify-content:space-between;gap:8px}
.job .nm{font-weight:600;overflow-wrap:anywhere}
.job .meta{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);margin-left:6px;font-weight:500}
.empty{border:1px dashed var(--line);border-radius:8px;padding:20px;color:var(--muted);text-align:center}

/* detail */
.detail-pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dhead .name{flex:1;min-width:180px;font-family:var(--f-display);font-size:24px;font-weight:600;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0}
.back{display:none}
@media (max-width:899px){.back{display:inline-block}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.step{background:transparent;border:0;border-top:4px solid var(--line);text-align:left;padding:6px 2px 0;font-size:12px;font-weight:600;color:var(--muted)}
.step.past{border-top-color:var(--accent)}
.step.now{border-top-color:var(--c);color:var(--c)}
.lostbar{display:flex;gap:10px;align-items:center;color:var(--s-lost);font-weight:600}
h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 8px;letter-spacing:.02em}
.sec{display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.f>input,.f>select,.f>textarea{color:var(--ink);font-size:14px}
.ints{display:flex;flex-wrap:wrap;gap:6px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1.1fr 1.7fr 78px 78px 60px 130px 30px;gap:8px;align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px}
.line .amt{display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.line .basis{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.line .amt b{font-family:var(--f-mono);font-weight:500}
.line .x{background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px}
@media (max-width:760px){
  .line{grid-template-columns:repeat(3,minmax(0,1fr))}
  .line .room,.line .prod{grid-column:1/-1}
  .line .amt{grid-column:1/3;align-items:flex-start}
  .line .x{grid-column:3;justify-self:end}
}
.totals{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:16px}
@media (max-width:700px){.totals{grid-template-columns:minmax(0,1fr)}}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-content:start}
.sum .mono{text-align:right}
.sum .grand{font-weight:600;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.disc{display:flex;gap:6px;align-items:center}
.disc input{width:100px;text-align:right}
.quote{font-family:var(--f-mono);font-size:12px;min-height:150px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* appointments + prices */
.days{display:flex;flex-direction:column;gap:16px;max-width:760px}
.day h3{display:flex;justify-content:space-between}
.appt{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.appt .tm{font-family:var(--f-mono);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;font-weight:600}
td{padding:4px 6px;border-top:1px solid var(--line)}
td input,td select{padding:6px 8px}
td.num input{text-align:right;font-family:var(--f-mono)}
#reqbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 12px}
#reqbox h3{margin:0}
.req{display:grid;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.foot{color:var(--muted);font-size:12px;padding-block:16px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.job,.chip,.btn{transition:border-color .15s,background .15s}}
</style>
</head><body>


<header class="top"><div class="wrap">
  <div class="brand"><img src="/logo-mark.png" alt=""><span class="bt"><b>Nook Curtains</b><small>Staff desk</small></span></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-act="tab" data-tab="jobs" aria-selected="true">Jobs</button>
    <button role="tab" data-act="tab" data-tab="appts" aria-selected="false">Appointments</button>
    <button role="tab" data-act="tab" data-tab="prices" aria-selected="false">Prices</button>
  </nav>
  <span class="savestate" id="savestate" role="status" aria-live="polite"></span>
</div></header>

<main class="wrap">
  <div id="banner"></div>

  <section id="view-jobs">
    <div class="split">
      <aside class="list-pane">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search name, phone, area" aria-label="Search jobs">
          <button class="btn primary" data-act="new-job" id="newjob">New enquiry</button>
        </div>
        <div class="row"><button class="btn sm" data-act="toggle-import" id="importbtn">Paste a customer request</button></div>
        <div class="banner" id="importpanel" hidden>
          <label class="f" for="importtext">Paste the message the customer sent from the estimate form</label>
          <textarea id="importtext" rows="7" placeholder="Name: ...&#10;Phone: ...&#10;Area: ...&#10;Needs: Curtains, Blinds"></textarea>
          <div class="row" style="margin-top:8px"><button class="btn primary sm" data-act="do-import">Create job</button><button class="btn sm" data-act="toggle-import">Cancel</button></div>
          <div class="f" id="importmsg" role="status" style="margin-top:6px"></div>
        </div>
        <div id="reqbox" hidden></div>
        <div class="chips" id="chips" role="group" aria-label="Filter by stage"></div>
        <ul class="jobs" id="joblist"></ul>
      </aside>
      <article class="detail-pane" id="detail" aria-live="polite"></article>
    </div>
  </section>

  <section id="view-appts" hidden></section>
  <section id="view-prices" hidden></section>
</main>

<footer class="wrap foot">
  Nook Curtains · No 5, Al Faraj Building, Amman Street, Al Qusais Industrial Area 4, Dubai · <span class="mono">0509186005</span> · <span class="mono">info@nookcurtains.com</span>
</footer>

<script>
/* Staff desk runtime for Netlify.
   The desk was written against a small database interface. This file provides that interface on top of
   this site's own /api, adds the sign-in screen, and keeps the desk in sync by checking for changes. */
(function () {
  'use strict';
  var POLL_MS = 20000;            // how often an open desk checks for changes made by others
  var COLS = ['jobs', 'prices', 'requests', 'settings'];

  var role = null, inflight = 0, wv = 0, etag = null, timer = null, polling = false, started = false, okOnce = false;
  var synced = false, offline = false, outbox = [], flushing = false, failedCount = 0, needSignIn = false, justSynced = false, retryTimer = null;
  var CACHE_DAYS = 7;             // how long a device may open the desk offline without signing in again (matches the login cookie)
  var listeners = { jobs: [], prices: [], requests: [], settings: [] };
  var last = {};
  var readyResolve;
  var ready = new Promise(function (r) { readyResolve = r; });

  function api(method, path, body, headers) {
    var h = { 'Accept': 'application/json' };
    if (method !== 'GET') h['Content-Type'] = 'application/json';
    Object.keys(headers || {}).forEach(function (k) { h[k] = headers[k]; });
    return fetch('/api' + path, {
      method: method, credentials: 'same-origin', headers: h,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
  }
  /* ---------- this device's saved copy (IndexedDB): last known data and changes waiting to sync ---------- */
  var idbp = null;
  function idb() {
    if (idbp) return idbp;
    idbp = new Promise(function (res) {
      try {
        var r = indexedDB.open('nook-desk', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
        r.onblocked = function () { res(null); };
      } catch (e) { res(null); }
    });
    return idbp;
  }
  function kv(mode, fn) {
    return idb().then(function (d) {
      if (!d) return undefined;
      return new Promise(function (res) {
        try {
          var req = fn(d.transaction('kv', mode).objectStore('kv'));
          req.onsuccess = function () { res(req.result); };
          req.onerror = function () { res(undefined); };
        } catch (e) { res(undefined); }
      });
    });
  }
  function kvGet(k) { return kv('readonly', function (s) { return s.get(k); }); }
  function kvSet(k, v) { return kv('readwrite', function (s) { return s.put(v, k); }); }
  function kvDel(k) { return kv('readwrite', function (s) { return s.delete(k); }); }
  function saveOutbox() {
    return kvSet('outbox', outbox.map(function (o) { return { col: o.col, id: o.id, method: o.method, body: o.body, t: o.t }; }));
  }
  var cacheTimer = null;
  function saveCache() {
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(function () {
      if (!role || !synced) return;
      kvSet('cache', { role: role, savedAt: Date.now(), data: last });
    }, 300);
  }
  function wipeLocal() {
    clearTimeout(cacheTimer);
    return Promise.all([kvDel('cache'), kvDel('outbox')]);
  }

  function rid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  /* ---------- sign in ---------- */
  function overlay(html) {
    var old = document.getElementById('nook-login');
    if (old) old.remove();
    var d = document.createElement('div');
    d.id = 'nook-login';
    d.setAttribute('role', 'dialog');
    d.setAttribute('aria-modal', 'true');
    d.style.cssText = 'position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px';
    d.innerHTML = '<div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px"><img src="/logo.png" alt="Nook Curtains" style="width:200px;max-width:70%;height:auto;align-self:center;mix-blend-mode:multiply">' + html + '</div>';
    document.body.appendChild(d);
    return d;
  }
  function showFatal(message) {
    var d = overlay('<h3 style="margin:0;font-family:var(--f-display);font-size:20px">Nook Curtains staff desk</h3><p style="margin:0">' + message + '</p>');
    return d;
  }
  function loginFlow(message, reloadAfter) {
    return new Promise(function (resolve) {
      var d = overlay(
        '<h3 style="margin:0;font-family:var(--f-display);font-size:20px">Nook Curtains staff desk</h3>' +
        '<form id="nook-login-form" style="display:flex;flex-direction:column;gap:12px">' +
        '<label class="f" for="nook-pw">Password<input id="nook-pw" type="password" autocomplete="current-password" required></label>' +
        '<button class="btn primary" type="submit" id="nook-login-btn">Sign in</button>' +
        '<div id="nook-login-msg" role="alert" style="color:var(--danger);min-height:1.3em;font-size:13px">' + (message || '') + '</div>' +
        '</form>');
      var form = d.querySelector('form'), pw = d.querySelector('#nook-pw'), msg = d.querySelector('#nook-login-msg'), btn = d.querySelector('#nook-login-btn');
      pw.focus();
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true; msg.textContent = '';
        api('POST', '/login', { password: pw.value }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) {
            if (r.ok) { role = j.role; d.remove(); if (reloadAfter) location.reload(); else resolve(); return; }
            msg.textContent = r.status === 429 ? (j.error || 'Too many tries. Wait and try again.') :
              r.status === 503 ? 'The site is not set up yet. Add the password settings in Netlify.' : 'Wrong password.';
            btn.disabled = false; pw.select();
          });
        }).catch(function () { msg.textContent = 'Could not reach the server. Check your connection.'; btn.disabled = false; });
      });
    });
  }
  function sessionLost() {
    if (document.getElementById('nook-login')) return;
    loginFlow('Your session ended. Sign in again to keep working.', true);
  }

  /* ---------- the database interface the desk uses ---------- */
  function colSnap(map) {
    var docs = Object.keys(map).map(function (k) {
      return { id: k, exists: true, data: function () { return map[k]; } };
    });
    return { docs: docs, size: docs.length };
  }
  function docSnap(id, v) {
    return v === undefined ? { id: id, exists: false, data: function () { return undefined; } }
                           : { id: id, exists: true, data: function () { return v; } };
  }
  /* Every save goes into a queue kept on this device, then is sent in order. If there is no connection
     the save simply stays queued and is sent when the connection is back. */
  function write(method, path, body) {
    var parts = path.split('/'), col = parts[1], id = decodeURIComponent(parts[2]);
    inflight++; wv++;
    return new Promise(function (resolve, reject) {
      var waiter = { resolve: resolve, reject: reject };
      var same = outbox.filter(function (o) { return o.col === col && o.id === id && !o.sending; })[0];
      if (same) { same.method = method; same.body = body; same.waiters.push(waiter); }
      else outbox.push({ col: col, id: id, method: method, body: body, t: Date.now(), sending: false, waiters: [waiter] });
      applyLocal(col, id, method === 'DELETE' ? undefined : body);
      saveOutbox();
      updateChip();
      flushOutbox();
    }).finally(function () { inflight--; wv++; etag = null; schedule(1500); });
  }
  function applyLocal(col, id, doc) {
    if (!synced) return;                  // nothing to keep a copy of until the first full read
    if (!last[col]) last[col] = {};
    if (doc === undefined) delete last[col][id];
    else last[col][id] = JSON.parse(JSON.stringify(doc));
    saveCache();
  }
  function settle(op, how, err) {
    op.waiters.splice(0).forEach(function (w) { how === 'ok' ? w.resolve() : w.reject(err); });
  }
  function setOffline(v) {
    if (offline === v) return;
    offline = v;
    if (!v && (outbox.length || justSynced)) justSynced = true;
    updateChip();
  }
  function retryLater(ms) {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () { flushOutbox().then(function () { if (!outbox.length) poll(); }); }, ms);
  }
  async function flushOutbox() {
    if (flushing) return;
    flushing = true;
    try {
      while (outbox.length) {
        var op = outbox[0];
        op.sending = true;
        var r;
        try {
          r = await api(op.method, '/' + op.col + '/' + encodeURIComponent(op.id), op.method === 'DELETE' ? undefined : op.body);
        } catch (e) {                         // no connection: keep it queued
          op.sending = false;
          setOffline(true); settle(op, 'ok'); updateChip(); retryLater(8000);
          return;
        }
        if (r.status === 401) {               // signed out: keep the changes, ask for the password
          op.sending = false; needSignIn = true; settle(op, 'ok'); updateChip(); sessionLost();
          return;
        }
        if (r.status >= 500 || r.status === 429 || r.status === 409) {   // server busy: try again shortly
          op.sending = false; settle(op, 'ok'); updateChip(); retryLater(10000);
          return;
        }
        outbox.shift();
        if (r.ok) { setOffline(false); settle(op, 'ok'); }
        else {                                // refused for good (not allowed, invalid): drop it and say so
          failedCount++;
          settle(op, 'fail', { code: r.status === 403 ? 'forbidden' : 'invalid_argument' });
        }
        saveOutbox();
        updateChip();
      }
      if (justSynced && !outbox.length) { setTimeout(function () { justSynced = false; updateChip(); }, 4000); }
      needSignIn = false;
      etag = null; schedule(500);
    } finally {
      flushing = false;
      updateChip();
    }
  }

  /* ---------- small status note: offline, waiting changes, synced ---------- */
  var chip = null;
  function updateChip() {
    if (!document.body) return;
    var n = outbox.length, msg = '', kind = '';
    if (needSignIn) { msg = 'Sign in again to save ' + n + ' waiting change' + (n === 1 ? '' : 's') + '.'; kind = 'warn'; }
    else if (failedCount) { msg = failedCount + ' change' + (failedCount === 1 ? ' was' : 's were') + ' not saved (not allowed or invalid). Tap to dismiss.'; kind = 'warn'; }
    else if (offline) {
      msg = 'Offline. ' + (n ? n + ' change' + (n === 1 ? ' is' : 's are') + ' saved on this device and will sync when you are back online.' : 'You can keep working. Changes sync when you are back online.');
      kind = 'off';
    }
    else if (n) { msg = 'Syncing ' + n + ' change' + (n === 1 ? '' : 's') + '…'; kind = 'sync'; }
    else if (justSynced) { msg = 'Back online. All changes synced.'; kind = 'ok'; }
    if (!msg) { if (chip) chip.hidden = true; return; }
    if (!chip) {
      chip = document.createElement('div');
      chip.id = 'nook-net';
      chip.setAttribute('role', 'status');
      chip.setAttribute('aria-live', 'polite');
      chip.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:40;max-width:min(420px,calc(100vw - 24px));padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.35;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:default';
      chip.addEventListener('click', function () { if (failedCount) { failedCount = 0; updateChip(); } });
      document.body.appendChild(chip);
    }
    chip.hidden = false;
    chip.textContent = msg;
    var c = { off: ['#2b2b2b', '#fff'], warn: ['#8a2c1f', '#fff'], sync: ['#1B5B58', '#fff'], ok: ['#1f6b3a', '#fff'] }[kind];
    chip.style.background = c[0]; chip.style.color = c[1];
  }
  window.addEventListener('online', function () { retryLater(200); });
  window.addEventListener('offline', function () { setOffline(true); });

  function docRef(col, id) {
    return {
      id: id,
      set: function (data) { return write('PUT', '/' + col + '/' + encodeURIComponent(id), data); },
      delete: function () { return write('DELETE', '/' + col + '/' + encodeURIComponent(id)); },
      onSnapshot: function (next, err) { return subscribe(col, function (map) { next(docSnap(id, map[id])); }, err); }
    };
  }
  var db = {
    collection: function (name) {
      return {
        doc: function (id) { return docRef(name, id || rid()); },
        onSnapshot: function (next, err) { return subscribe(name, function (map) { next(colSnap(map)); }, err); }
      };
    },
    doc: function (path) { var a = path.split('/'); return docRef(a[0], a[1]); }
  };

  function subscribe(col, cb, err) {
    var l = { cb: cb, err: err, json: null };
    listeners[col].push(l);
    if (last[col]) deliver(col, l);
    if (!started) { started = true; poll(); }
    return function () { listeners[col] = listeners[col].filter(function (x) { return x !== l; }); };
  }
  function deliver(col, l) {
    var json = JSON.stringify(last[col]);
    if (l.json === json) return;
    l.json = json;
    l.cb(last[col]);
  }
  function fail() {
    COLS.forEach(function (c) { listeners[c].forEach(function (l) { if (l.err) l.err({ code: 'unavailable' }); }); });
  }
  function schedule(ms) {
    clearTimeout(timer);
    if (!started) return;
    timer = setTimeout(poll, document.hidden ? Math.max(ms, 60000) : ms);
  }
  async function poll() {
    if (polling) return;
    polling = true;
    var delay = POLL_MS;
    try {
      if (outbox.length) { flushOutbox(); delay = 1500; return; }   // our own waiting changes go first
      var v = wv;
      var r = await api('GET', '/all', undefined, etag ? { 'If-None-Match': etag } : {});
      if (r.status === 401) { sessionLost(); return; }
      if (r.status !== 304) {
        if (!r.ok) throw new Error('http ' + r.status);
        var j = await r.json();
        // If something was saved while this request was in flight, the reading may be out of date: discard it.
        if (wv !== v || inflight > 0 || outbox.length) { delay = 800; }
        else {
          etag = r.headers.get('ETag');
          COLS.forEach(function (c) {
            last[c] = j[c] || {};
            listeners[c].slice().forEach(function (l) { deliver(c, l); });
          });
          synced = true;
          saveCache();
        }
      }
      okOnce = true;
      setOffline(false);
    } catch (e) {
      if (!okOnce) fail();
      else { setOffline(true); delay = 10000; }
    } finally {
      polling = false;
      schedule(delay);
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && started) { clearTimeout(timer); poll(); }
  });

  /* ---------- who is using the desk, and saving files ---------- */
  var user = {
    isOwner: function () { return Promise.resolve(role === 'admin'); },
    canEdit: function () { return Promise.resolve(role === 'admin'); },
    can: function () { return Promise.resolve(true); },
    id: function () { return Promise.resolve(role); },
    me: function () { return Promise.resolve({ id: role, name: '', isOwner: role === 'admin', canEdit: role === 'admin' }); }
  };
  var TYPES = { html: 'text/html;charset=utf-8', csv: 'text/csv;charset=utf-8', json: 'application/json', txt: 'text/plain;charset=utf-8' };
  var downloads = {
    save: function (req) {
      return new Promise(function (resolve, reject) {
        try {
          var ext = (req.filename.split('.').pop() || '').toLowerCase();
          var blob = req.data instanceof Blob ? req.data : new Blob([req.data], { type: TYPES[ext] || 'application/octet-stream' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = req.filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
          resolve({ status: 'saved' });
        } catch (e) { reject({ code: 'unavailable' }); }
      });
    }
  };

  window.claude = {
    use: function (name) {
      return ready.then(function () {
        return name === 'db' ? db : name === 'user' ? user : name === 'downloads' ? downloads : null;
      });
    }
  };

  /* ---------- header: Data menu (export, backup, restore) and sign out ---------- */
  var BTN = 'background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer';
  function headerButton(label, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = BTN;
    b.addEventListener('click', onClick);
    return b;
  }
  function note(text, isError) {
    var d = document.getElementById('nook-note');
    if (!d) {
      d = document.createElement('div');
      d.id = 'nook-note';
      d.setAttribute('role', 'status');
      d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:60;max-width:min(520px,calc(100vw - 24px));padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.3);cursor:pointer';
      d.addEventListener('click', function () { d.remove(); });
      document.body.appendChild(d);
    }
    d.style.background = isError ? '#8a2c1f' : '#1B5B58';
    d.style.color = '#fff';
    d.textContent = text;
    clearTimeout(note.t);
    note.t = setTimeout(function () { d.remove(); }, isError ? 9000 : 5000);
  }
  function today() { return new Date().toISOString().slice(0, 10); }

  function downloadBackup(btn) {
    if (offline) { note('Backups need a connection. Try again when you are back online.', true); return Promise.reject({ code: 'offline' }); }
    return fetch('/api/export', { credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) throw new Error('export failed');
      return r.blob();
    }).then(function (blob) {
      return downloads.save({ filename: 'nook-backup-' + today() + '.json', data: blob });
    });
  }

  /* Restore: pick a backup file, confirm, save a copy of today's data, then replace everything with the file. */
  function askConfirm(title, body, okLabel) {
    return new Promise(function (resolve) {
      var d = document.createElement('div');
      d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
      d.style.cssText = 'position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px';
      d.innerHTML = '<div style="background:var(--surface,#fff);color:var(--ink,#18262A);border-radius:10px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px">' +
        '<h3 style="margin:0;font-size:18px"></h3><p style="margin:0;line-height:1.45;white-space:pre-line"></p>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn" data-x="no">Cancel</button><button type="button" class="btn primary" data-x="yes"></button></div></div>';
      d.querySelector('h3').textContent = title;
      d.querySelector('p').textContent = body;
      d.querySelector('[data-x="yes"]').textContent = okLabel;
      function done(v) { d.remove(); resolve(v); }
      d.addEventListener('click', function (e) { var x = e.target && e.target.getAttribute && e.target.getAttribute('data-x'); if (x) done(x === 'yes'); });
      d.addEventListener('keydown', function (e) { if (e.key === 'Escape') done(false); });
      document.body.appendChild(d);
      d.querySelector('[data-x="no"]').focus();
    });
  }
  function restoreFlow() {
    if (offline) { note('Restoring needs a connection. Try again when you are back online.', true); return; }
    if (outbox.length) { note('Wait until the waiting changes have synced, then try again.', true); return; }
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      if (f.size > 5 * 1024 * 1024) { note('That file is too large to be a backup (limit 5 MB).', true); return; }
      f.text().then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (e) { note('That file is not a backup made by this app.', true); return; }
        var has = ['jobs', 'prices', 'requests', 'settings'].filter(function (k) { return data && typeof data[k] === 'object' && data[k] && !Array.isArray(data[k]); });
        if (!has.length) { note('That file is not a backup made by this app.', true); return; }
        var count = function (k) { return has.indexOf(k) < 0 ? 0 : Object.keys(data[k]).length; };
        var when = data.exportedAt ? new Date(data.exportedAt) : null;
        var lines = 'Backup' + (when && !isNaN(when) ? ' from ' + when.toLocaleString('en-GB') : '') + ': ' + count('jobs') + ' jobs, ' + count('prices') + ' price items, ' + count('requests') + ' customer requests.\n\n' +
          'This REPLACES what is in the desk now' + (has.length < 4 ? ' (for the parts the file contains)' : '') + '. A copy of the current data downloads first, so you can undo this.';
        return askConfirm('Restore this backup?', lines, 'Replace everything').then(function (yes) {
          if (!yes) return;
          note('Saving a copy of the current data…');
          return downloadBackup().then(function () {
            return api('POST', '/restore', data);
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) {
              if (r.status === 401) { sessionLost(); return; }
              if (!r.ok) { note('Not restored: ' + (j.error || 'the server refused the file') + '. Nothing was changed.', true); return; }
              return wipeLocal().then(function () {
                note('Backup restored. Reloading…');
                setTimeout(function () { location.reload(); }, 900);
              });
            });
          });
        });
      }).catch(function () { note('Could not read or restore the file. Nothing was changed.', true); });
    });
    inp.click();
  }

  function exportCsv(which) {
    var x = window.NookExport;
    if (!x || !x[which]) { note('Export is not available.', true); return; }
    x[which]().then(function () { note('Spreadsheet saved. Open it with Excel or Google Sheets.'); }, function () { note('Could not save the file. Try again.', true); });
  }

  function dataMenu() {
    var wrap = document.createElement('div');
    wrap.className = 'nook-hb';
    wrap.style.cssText = 'position:relative;display:inline-block';
    var btn = headerButton('Data ▾', function (e) { e.stopPropagation(); toggle(); });
    btn.setAttribute('aria-haspopup', 'menu'); btn.setAttribute('aria-expanded', 'false');
    var menu = document.createElement('div');
    menu.setAttribute('role', 'menu'); menu.hidden = true;
    menu.style.cssText = 'position:absolute;right:0;top:calc(100% + 6px);z-index:45;min-width:230px;background:#fff;color:#18262A;border:1px solid #D3D9D5;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column';
    function item(label, hint, fn) {
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('role', 'menuitem');
      b.style.cssText = 'text-align:left;background:transparent;border:0;border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;color:inherit;cursor:pointer';
      b.innerHTML = '<span style="display:block;font-weight:600"></span><span style="display:block;font-size:12px;opacity:.7"></span>';
      b.firstChild.textContent = label; b.lastChild.textContent = hint;
      b.addEventListener('mouseenter', function () { b.style.background = '#EEF2EF'; });
      b.addEventListener('mouseleave', function () { b.style.background = 'transparent'; });
      b.addEventListener('click', function () { close(); fn(); });
      menu.appendChild(b);
    }
    item('Export jobs (spreadsheet)', 'One row per customer job. Opens in Excel.', function () { exportCsv('jobs'); });
    item('Export windows and items', 'One row per window or item, with prices.', function () { exportCsv('items'); });
    if (role === 'admin') {
      item('Download backup', 'Everything, to keep safe (.json file).', function () {
        downloadBackup().then(function () { note('Backup saved. Keep the file somewhere safe.'); }, function (e) { if (!(e && e.code === 'offline')) note('The backup could not be downloaded.', true); });
      });
      item('Restore from backup…', 'Replace the data with a backup file.', restoreFlow);
    }
    function toggle() { menu.hidden ? open() : close(); }
    function open() { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
    function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    wrap.appendChild(btn); wrap.appendChild(menu);
    return wrap;
  }

  function signOut() {
    var go = function () {
      wipeLocal().then(function () {
        return api('POST', '/logout', {}).catch(function () {});
      }).then(function () { location.reload(); });
    };
    if (outbox.length) {
      askConfirm('Sign out now?', outbox.length + ' change' + (outbox.length === 1 ? ' has' : 's have') + ' not synced yet. If you sign out they will be lost.', 'Sign out anyway').then(function (yes) { if (yes) go(); });
    } else if (offline) {
      askConfirm('Sign out while offline?', 'This removes the saved data from this device. You will need a connection to sign in again.', 'Sign out').then(function (yes) { if (yes) go(); });
    } else go();
  }

  ready.then(function () {
    var bar = document.querySelector('.top .wrap');
    if (!bar) return;
    bar.appendChild(dataMenu());
    var so = headerButton('Sign out', signOut);
    so.className = 'nook-hb';
    bar.appendChild(so);
    updateChip();
  });

  /* ---------- start ---------- */
  function loadOutbox() {
    return kvGet('outbox').then(function (list) {
      if (Array.isArray(list) && list.length) {
        outbox = list.map(function (o) { return { col: o.col, id: o.id, method: o.method, body: o.body, t: o.t, sending: false, waiters: [] }; });
      }
    });
  }
  function startOffline() {
    return kvGet('cache').then(function (c) {
      var fresh = c && c.role && c.data && Date.now() - c.savedAt < CACHE_DAYS * 86400000;
      if (!fresh) {
        showFatal('You are offline and this device has no saved copy yet. Connect to the internet and open the desk once, then it will also work offline.');
        return;
      }
      role = c.role;
      COLS.forEach(function (k) { last[k] = c.data[k] || {}; });
      okOnce = true; offline = true; synced = true;
      return loadOutbox().then(function () {
        outbox.forEach(function (o) { applyLocal(o.col, o.id, o.method === 'DELETE' ? undefined : o.body); });
        readyResolve(); updateChip(); retryLater(8000);
      });
    });
  }
  api('GET', '/session').then(function (r) {
    if (r.ok) return r.json().then(function (j) {
      role = j.role;
      return loadOutbox().then(function () {
        readyResolve();
        if (outbox.length) { justSynced = true; flushOutbox(); }
      });
    });
    if (r.status === 503) { showFatal('This site is not set up yet. In Netlify, add the STAFF_PASSWORD, ADMIN_PASSWORD and AUTH_SECRET settings, then deploy again.'); return; }
    return loginFlow().then(function () {
      return loadOutbox().then(function () { readyResolve(); if (outbox.length) flushOutbox(); });
    });
  }).catch(function () {
    return startOffline();
  }).catch(function () {
    showFatal('Could not reach the server. Check your connection and reload the page.');
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
  }
})();

<script>
(function(){
'use strict';

var STAGES=[
  {id:'enquiry',label:'Enquiry'},
  {id:'measure',label:'Measure booked'},
  {id:'quoted',label:'Quoted'},
  {id:'confirmed',label:'Fabric confirmed'},
  {id:'install',label:'Installation'},
  {id:'done',label:'Done'},
  {id:'lost',label:'Lost'}
];
var STAGE=Object.fromEntries(STAGES.map(function(s){return [s.id,s]}));
var FLOW=STAGES.slice(0,6);
var SOURCES=['Phone call','WhatsApp','Email','Website form','Walk-in','Referral'];
var INTERESTS=['Curtains','Blinds','Roman blinds','Roller blinds','Carpets','Office carpet tiles','Wallpaper','Vinyl flooring','Furniture'];
var UNITS={m:'per m of width',sqm:'per m²',pc:'per piece'};
var UNIT_SHORT={m:'m',sqm:'m²',pc:'pc'};
var VAT=0.05;
var DEFAULT_TERMS=[
  'This quotation is valid for 14 days from its date.',
  'The order is confirmed when the customer signs this document and pays the deposit.',
  'Everything agreed at signing is final: fabric, colour, style, sizes, quantities, prices and the installation work.',
  'Any change asked for after signing is charged extra. This includes the cost of fabric or materials already ordered or cut, extra labour and any repeat site visit. A revised quotation will be issued and must be approved before the change is made.',
  'Made-to-measure items cannot be cancelled or returned once production has started. The deposit is not refundable once fabric has been ordered or cut.',
  'Measurements taken by Nook Curtains are final. If the customer gives their own measurements, Nook Curtains is not responsible for how the items fit.',
  'The balance is due on delivery or installation, as stated on the invoice.',

  'Fabric colour and shade may differ slightly from samples, photos and screens.',
  'Please report any defect within 7 days of installation.'
].join('\n');
var BIZ={phone:'0509186005',email:'info@nookcurtains.com'};

var db=null, dl=null, jobs=new Map(), prices=new Map(), requests=new Map(), settings={trn:'',terms:'',vat:true,conditions:''}, curLock=false;
var sel=null, tab='jobs', q='', filter='open';
var RO=false, canPrice=true, localMode=false, loaded={jobs:false,prices:false}, dbError='';
var saving=new Map(), renderedJson='';

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function r2(n){return Math.round(n*100)/100}
function aed(n){return 'AED '+r2(n).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function uid(){return Math.random().toString(36).slice(2,10)}
function dis(){return RO?' disabled':''}

/* ---------- pricing ---------- */
function lineBasis(l,p){
  var w=num(l.w),h=num(l.h),qty=num(l.qty)||1;
  if(!p)return {text:'',amount:0};
  if(p.unit==='m'){var m=w/100;return {text:m?m.toFixed(2)+' m × '+qty:'',amount:p.rate*m*qty}}
  if(p.unit==='sqm'){
    var raw=(w*h)/10000,min=num(p.min),a=Math.max(raw,min);
    var t=raw?(a.toFixed(2)+' m²'+(a>raw?' (min)':'')+' × '+qty):'';
    return {text:t,amount:p.rate*(raw?a:0)*qty};
  }
  return {text:qty+' pc',amount:p.rate*qty};
}
function lineAmount(l){var p=prices.get(l.priceId);return r2(lineBasis(l,p).amount)}
function totals(j){
  var sub=r2((j.lines||[]).reduce(function(s,l){return s+lineAmount(l)},0));
  var disc=Math.min(num(j.discount),sub);
  var fee=Math.max(0,num(j.changeFee));
  var net=r2(sub-disc+fee),vat=settings.vat?r2(net*VAT):0;
  return {sub:sub,disc:disc,fee:fee,net:net,vat:vat,total:r2(net+vat)};
}
function quoteText(j){
  var t=totals(j),L=[];
  L.push('Nook Curtains quotation'+(j.name?' for '+j.name:''));
  L.push('');
  (j.lines||[]).forEach(function(l,i){
    var p=prices.get(l.priceId); if(!p)return;
    var size=(p.unit!=='pc'&&num(l.w))?' '+num(l.w)+' × '+(num(l.h)||'-')+' cm':'';
    var qty=(num(l.qty)||1)>1?' ×'+num(l.qty):'';
    L.push((i+1)+'. '+(l.room||'Window')+' – '+p.name+size+qty+': '+aed(lineAmount(l)));
  });
  L.push('');
  L.push('Subtotal: '+aed(t.sub));
  if(t.disc)L.push('Discount: -'+aed(t.disc));
  if(t.fee)L.push('Change fee (after signing): '+aed(t.fee));
  if(settings.vat)L.push('VAT 5%: '+aed(t.vat));
  L.push('Total: '+aed(t.total));
  L.push('');
  L.push('Terms: this quotation is valid for 14 days. The order is confirmed when you sign the quotation and pay the deposit. Changes after signing are charged extra.');
  L.push('');
  L.push(BIZ.phone+' · '+BIZ.email);
  return L.join('\n');
}

/* ---------- saving ---------- */
function setSave(state){
  var el=$('#savestate');el.dataset.s=state;
  el.textContent={saving:'Saving…',saved:'All changes saved',error:'Not saved. Check connection',local:'Not kept: no shared storage',idle:''}[state]||'';
}
function plain(o){var c=Object.assign({},o);delete c.id;return JSON.parse(JSON.stringify(c))}
function queueSave(col,id,delay){
  var key=col+'/'+id,s=saving.get(key);
  if(!s){s={inflight:false,dirty:false,timer:null};saving.set(key,s)}
  s.dirty=true;clearTimeout(s.timer);
  s.timer=setTimeout(function(){flush(col,id)},delay==null?500:delay);
  setSave(db?'saving':'local');
}
function flush(col,id){
  var key=col+'/'+id,s=saving.get(key);
  if(!s||s.inflight||!s.dirty)return;
  var obj=(col==='jobs'?jobs:prices).get(id);
  if(!db||!obj){saving.delete(key);return}
  s.inflight=true;s.dirty=false;
  db.collection(col).doc(id).set(plain(obj)).then(function(){
    s.inflight=false;
    if(s.dirty)flush(col,id);
    else{saving.delete(key);setSave(saving.size?'saving':'saved')}
  },function(){
    s.inflight=false;s.dirty=true;setSave('error');
  });
}
function busy(col,id){var s=saving.get(col+'/'+id);return !!(s&&(s.dirty||s.inflight))}

function applySnap(col,snap){
  var map=col==='jobs'?jobs:col==='requests'?requests:prices,seen=new Set();
  snap.docs.forEach(function(d){
    seen.add(d.id);
    if(busy(col,d.id))return;
    /* snapshot data is read-only all the way down, so keep an editable deep copy */
    map.set(d.id,Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()))));
  });
  Array.from(map.keys()).forEach(function(id){if(!seen.has(id)&&!busy(col,id))map.delete(id)});
  loaded[col]=true;
  renderAll(true);
}

function invoiceFile(j){return docFile(j,'invoice')}
function quoteFile(j){return docFile(j,'quote')}
function settingsHTML(){
  var ro=(!canPrice||RO)?' disabled':'';
  return '<div class="sec" style="margin-top:20px;max-width:760px"><h3>Invoice details</h3><div class="grid">'+
    '<label class="f">Tax registration number (TRN)<input data-sf="trn" value="'+esc(settings.trn)+'" placeholder="Shown on invoices when filled in"'+ro+'></label>'+
    '<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-sf="vat"'+(settings.vat?' checked':'')+ro+'> Charge 5% VAT on quotes and invoices</label>'+
    '<label class="f">Payment terms line<input data-sf="terms" value="'+esc(settings.terms)+'" placeholder="Balance due on installation"'+ro+'></label>'+
    '</div><label class="f" style="margin-top:10px">Terms and conditions shown on quotations and invoices (one point per line)<textarea data-sf="conditions" rows="9"'+ro+'>'+esc(termsText())+'</textarea></label>'+
    '<p class="f" style="margin:6px 0 0">Clear the box to go back to the standard wording. Have the wording checked to suit your business.</p>'+
    '<p class="f" style="margin:6px 0 0">With VAT on and a TRN filled in, the document is titled Tax invoice. Otherwise it is titled Invoice. Turn VAT off if the business is not VAT-registered.</p></div>';
}
function saveSetting(k,v){
  settings[k]=(k==='vat')?!!v:String(v).replace(/\r/g,'').trim();
  if(k==='conditions'&&settings.conditions===DEFAULT_TERMS)settings.conditions='';
  if(k==='vat'){renderDetail();renderList();renderPrices()}
  if(!db)return;
  setSave('saving');
  db.doc('settings/invoice').set({trn:settings.trn||'',terms:settings.terms||'',vat:settings.vat,conditions:settings.conditions||''}).then(function(){setSave(saving.size?'saving':'saved')},function(){setSave('error')});
}

function renderDetail(){
  var el=$('#detail'),j=sel&&jobs.get(sel);
  if(!j){
    renderedJson='';
    el.innerHTML='<div class="empty">'+(jobs.size?'Pick a job from the list to see its measurements and quote.':'Nothing open. Add an enquiry to start a job sheet.')+'</div>';
    document.body.classList.remove('open-detail');
    return;
  }
  el.innerHTML=detailHTML(j);
  renderedJson=JSON.stringify(j);
  document.body.classList.add('open-detail');
  refreshCalc(j);
}
function refreshCalc(j){
  var t=totals(j);
  var set=function(k,v){var e=$('[data-t="'+k+'"]');if(e)e.textContent=aed(v)};
  set('sub',t.sub);set('fee',t.fee);set('vat',t.vat);set('total',t.total);set('due',dueOf(j));
  var has=t.sub>0;
  ['quote','sign','invoice'].forEach(function(k){var e=$('[data-act="'+k+'"]');if(e)e.disabled=!has||(k==='sign'&&RO)});
  var qm=$('#quotemsg');if(qm&&has&&/^Add at least/.test(qm.textContent))qm.textContent='';
  $$('#lines .line').forEach(function(row){
    var l=(j.lines||[]).find(function(x){return x.id===row.dataset.line});if(!l)return;
    var p=prices.get(l.priceId),b=lineBasis(l,p);
    $('[data-basis]',row).textContent=b.text;
    $('[data-amt]',row).textContent=aed(lineAmount(l));
  });
  var qt=$('#quoteText');if(qt)qt.value=quoteText(j);
}

function renderAppts(){
  var el=$('#view-appts');
  var now=new Date(),today=ymd(now);
  var withAppt=Array.from(jobs.values()).filter(function(j){return j.apptAt&&j.stage!=='lost'&&j.stage!=='done'}).sort(function(a,b){return a.apptAt<b.apptAt?-1:1});
  var upcoming=withAppt.filter(function(j){return j.apptAt.slice(0,10)>=today});
  var late=withAppt.filter(function(j){return j.apptAt.slice(0,10)<today&&(j.stage==='measure'||j.stage==='install')});
  function item(j){
    var a=parseAppt(j.apptAt);
    return '<button class="appt" data-act="open" data-id="'+esc(j.id)+'"><span class="tm">'+esc(fmtTime(a))+'</span>'+
      '<span><b>'+esc(j.name||'Unnamed enquiry')+'</b><br><span class="f">'+esc([j.visit,j.area].filter(Boolean).join(' · '))+'</span></span>'+stageTag(j.stage)+'</button>';
  }
  var h='<div class="days">';
  if(late.length)h+='<div class="day"><h3 style="color:var(--danger)">Past visits still open</h3>'+late.map(item).join('')+'</div>';
  var groups={};upcoming.forEach(function(j){(groups[j.apptAt.slice(0,10)]=groups[j.apptAt.slice(0,10)]||[]).push(j)});
  var tomorrow=new Date(now.getTime()+864e5),tom=ymd(tomorrow);
  Object.keys(groups).sort().forEach(function(k){
    var d=new Date(k+'T00:00'),label=k===today?'Today':k===tom?'Tomorrow':fmtDay(d);
    h+='<div class="day"><h3><span>'+esc(label)+'</span><span class="mono f">'+groups[k].length+' visit'+(groups[k].length>1?'s':'')+'</span></h3>'+groups[k].map(item).join('')+'</div>';
  });
  if(!late.length&&!upcoming.length)h+='<div class="empty">No visits booked. Set a date and time on a job to see it here.</div>';
  el.innerHTML=h+'</div>';
}

function renderPrices(){
  var el=$('#view-prices');
  var list=Array.from(prices.values()).sort(function(a,b){return (String(a.category).localeCompare(b.category))||String(a.name).localeCompare(b.name)});
  var ro=(!canPrice||RO)?' disabled':'';
  var rows=list.map(function(p){
    return '<tr data-id="'+esc(p.id)+'">'+
      '<td><input data-pf="name" value="'+esc(p.name)+'" aria-label="Item name"'+ro+'>'+(p.example?'<span class="tag">Example</span>':'')+'</td>'+
      '<td><select data-pf="category" aria-label="Category"'+ro+'>'+INTERESTS.map(function(c){return '<option'+(c===p.category?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></td>'+
      '<td><select data-pf="unit" aria-label="Priced by"'+ro+'>'+Object.keys(UNITS).map(function(u){return '<option value="'+u+'"'+(u===p.unit?' selected':'')+'>'+esc(UNITS[u])+'</option>'}).join('')+'</select></td>'+
      '<td class="num"><input data-pf="rate" inputmode="decimal" value="'+esc(p.rate)+'" aria-label="Rate in AED"'+ro+'></td>'+
      '<td class="num"><input data-pf="min" inputmode="decimal" value="'+esc(p.unit==='sqm'?(p.min||''):'')+'" placeholder="–" aria-label="Minimum billed area in square metres"'+(p.unit==='sqm'?ro:' disabled')+'></td>'+
      '<td>'+((!canPrice||RO)?'':'<button class="btn sm danger" data-act="rm-price">Remove</button>')+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="banner">'+(settings.vat?'Rates are in AED before 5% VAT.':'Rates are in AED. VAT is switched off.')+' Rows tagged Example are placeholders until you change them.'+((!canPrice&&!localMode)?' Only editors can change prices.':'')+'</div>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn primary" data-act="add-price"'+((!canPrice||RO)?' disabled':'')+'>Add item</button></div>'+
    '<div class="scroll"><table><thead><tr><th>Item</th><th>Category</th><th>Priced</th><th>Rate (AED)</th><th>Min m²</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="6"><div class="empty">No items yet. Add curtains, blinds, carpets and the rest with their rates.</div></td></tr>')+'</tbody></table></div>'+settingsHTML();
}

function reqVisit(r){return [r.date?longDate(r.date):'',r.slot].filter(Boolean).join(', ')}
function renderReqs(){
  var box=$('#reqbox');if(!box)return;
  var list=Array.from(requests.values()).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  if(!list.length){box.hidden=true;box.innerHTML='';return}
  box.hidden=false;
  box.innerHTML='<h3>New customer requests <span class="mono">'+list.length+'</span></h3>'+list.map(function(r){
    var sub=[(r.needs||[]).join(', '),r.area,reqVisit(r)?'Prefers '+reqVisit(r):''].filter(Boolean).join(' · ');
    return '<div class="req"><div><b>'+esc(r.name||'No name')+'</b> <span class="mono">'+esc(r.phone||'')+'</span><div class="f">'+esc(sub)+'</div></div>'+
      '<div class="row"><button class="btn primary sm" data-act="req-create" data-id="'+esc(r.id)+'"'+dis()+'>Create job</button><button class="btn sm" data-act="req-dismiss" data-id="'+esc(r.id)+'"'+dis()+'>Dismiss</button></div></div>';
  }).join('');
}
function renderAll(fromSnap){
  renderBanner();
  renderList();
  renderReqs();
  var active=document.activeElement;
  var inDetail=active&&$('#detail').contains(active)&&/INPUT|TEXTAREA|SELECT/.test(active.tagName);
  var j=sel&&jobs.get(sel);
  if(sel&&!j){sel=null;renderDetail()}
  else if(!fromSnap){renderDetail()}
  else if(j&&!inDetail&&JSON.stringify(j)!==renderedJson){renderDetail()}
  else if(j&&inDetail){refreshCalc(j)}
  if(!j&&!sel&&!renderedJson&&$('#detail').children.length===0)renderDetail();
  if(tab==='appts')renderAppts();
  if(tab==='prices'){var pa=document.activeElement;if(!(pa&&$('#view-prices').contains(pa)&&/INPUT|SELECT/.test(pa.tagName)))renderPrices()}
}

/* ---------- actions ---------- */
function touch(j){j.updatedAt=Date.now();queueSave('jobs',j.id)}
function newJob(){
  var id=db?db.collection('jobs').doc().id:uid();
  var j={id:id,name:'',phone:'',email:'',area:'',source:'Phone call',stage:'enquiry',interest:[],visit:'Measurement',apptAt:'',notes:'',lines:[],discount:0,createdAt:Date.now(),updatedAt:Date.now()};
  jobs.set(id,j);sel=id;queueSave('jobs',id,0);
  filter='open';q='';$('#search').value='';
  renderAll();
  var n=$('.name');if(n)n.focus();
}
function parseRequest(text){
  var get=function(label){var m=text.match(new RegExp('^\\s*'+label+'\\s*:\\s*(.+)$','im'));return m?m[1].trim():''};
  var needs=get('Needs').split(',').map(function(s){return s.trim()}).filter(function(s){return INTERESTS.indexOf(s)>-1});
  return {name:get('Name'),phone:get('Phone'),area:get('Area'),prop:get('Property'),needs:needs,windows:get('Windows'),visit:get('Preferred visit'),notes:get('Notes')};
}
function createJobFrom(r){
  var id=db?db.collection('jobs').doc().id:uid();
  var notes=[];
  if(r.visit)notes.push('Customer prefers: '+r.visit);
  if(r.prop)notes.push('Property: '+r.prop);
  if(r.windows)notes.push('Windows: about '+r.windows);
  if(r.notes)notes.push(r.notes);
  var j={id:id,name:r.name,phone:r.phone,email:'',area:r.area,source:'Website form',stage:'enquiry',interest:r.needs,visit:'Measurement',apptAt:'',notes:notes.join('\n'),lines:[],discount:0,createdAt:Date.now(),updatedAt:Date.now()};
  jobs.set(id,j);sel=id;queueSave('jobs',id,0);filter='open';q='';$('#search').value='';
  return id;
}
function importJob(text){var r=parseRequest(text);if(!r.name&&!r.phone)return false;createJobFrom(r);return true}
function setTab(t){
  tab=t;
  $$('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===t))});
  $('#view-jobs').hidden=t!=='jobs';$('#view-appts').hidden=t!=='appts';$('#view-prices').hidden=t!=='prices';
  if(t==='appts')renderAppts();
  if(t==='prices')renderPrices();
}
function addPrice(){
  var id=db?db.collection('prices').doc().id:uid();
  prices.set(id,{id:id,name:'New item',category:'Curtains',unit:'m',rate:0,min:0});
  queueSave('prices',id,0);renderPrices();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.dataset.act,j=sel&&jobs.get(sel);
  switch(act){
    case 'tab':setTab(b.dataset.tab);break;
    case 'new-job':newJob();break;
    case 'chip':filter=b.dataset.v;q='';$('#search').value='';renderList();break;
    case 'open':sel=b.dataset.id;setTab('jobs');renderList();renderDetail();window.scrollTo(0,0);break;
    case 'back':sel=null;document.body.classList.remove('open-detail');renderList();break;
    case 'stage':if(j){j.stage=b.dataset.stage;touch(j);renderList();renderDetail()}break;
    case 'int':if(j){var a=j.interest||(j.interest=[]),i=a.indexOf(b.dataset.v);if(i>-1)a.splice(i,1);else a.push(b.dataset.v);b.setAttribute('aria-pressed',String(i===-1));touch(j);renderList()}break;
    case 'add-line':if(j){(j.lines=j.lines||[]).push({id:uid(),room:'',priceId:'',w:0,h:0,qty:1});touch(j);renderDetail();var rs=$$('#lines .line');var last=rs[rs.length-1];if(last)$('input',last).focus()}break;
    case 'rm-line':if(j){var id=b.closest('.line').dataset.line;j.lines=j.lines.filter(function(l){return l.id!==id});touch(j);renderList();renderDetail()}break;
    case 'disc100':if(j){j.discount=100;touch(j);var di=$('[data-f="discount"]');if(di)di.value='100';refreshCalc(j);renderList()}break;
    case 'copy':if(j){var t=quoteText(j);var done=function(m){b.textContent=m;setTimeout(function(){b.textContent='Copy quote'},1800)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done('Copied')},function(){var ta=$('#quoteText');ta.select();done('Select and copy')})}
      else{var ta=$('#quoteText');ta.select();done('Select and copy')}}break;
    case 'del-job':
      if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Click again to delete';setTimeout(function(){b.dataset.armed='';b.textContent='Delete job'},4000)}
      else if(j){var id2=j.id;jobs.delete(id2);saving.delete('jobs/'+id2);sel=null;if(db)db.collection('jobs').doc(id2).delete().catch(function(){setSave('error')});renderAll()}
      break;
    case 'invoice':if(j){
      var ni=$('[data-f="invoiceNo"]'),nd=$('[data-f="invoiceDate"]');
      j.invoiceNo=((ni&&ni.value)||j.invoiceNo||suggestInvNo(j)).trim();
      j.invoiceDate=(nd&&nd.value)||j.invoiceDate||ymd(new Date());
      touch(j);renderedJson=JSON.stringify(j);
      var say=function(m){var e=$('#invmsg');if(e)e.textContent=m};
      if(!dl){say('Saving files is not available in this view.');break}
      say('Confirm the save in the box that appears.');
      dl.save({filename:invoiceName(j),data:invoiceFile(j)}).then(function(){say('Saved. Open the file, then press Print or choose Save as PDF.')},function(err){say(err&&err.code==='declined'?'Save cancelled.':'Could not save the file. Try again.')});
    }break;
    case 'quote':if(j){
      var qd=$('[data-f="quoteDate"]');
      if(qd&&qd.value)j.quoteDate=qd.value;else if(!j.quoteDate)j.quoteDate=ymd(new Date());
      touch(j);renderedJson=JSON.stringify(j);
      var qsay=function(m){var e=$('#quotemsg');if(e)e.textContent=m};
      if(!dl){qsay('Saving files is not available in this view.');break}
      qsay('Confirm the save in the box that appears.');
      dl.save({filename:quoteName(j),data:quoteFile(j)}).then(function(){qsay('Saved. Open the file, then press Print and have the customer sign.')},function(err){qsay(err&&err.code==='declined'?'Save cancelled.':'Could not save the file. Try again.')});
    }break;
    case 'sign':if(j){
      var sb=$('[data-f="signedBy"]'),sd=$('[data-f="signDate"]');
      var who=String((sb&&sb.value)||j.signedBy||j.name||'').trim();
      if(!who){var m1=$('#quotemsg');if(m1)m1.textContent='Enter the name of the person who signed.';break}
      j.signedBy=who;j.signedAt=(sd&&sd.value)||ymd(new Date());j.unlocked=false;
      touch(j);renderList();renderDetail();
    }break;
    case 'unlock':if(j){j.unlocked=true;touch(j);renderDetail()}break;
    case 'relock':if(j){j.unlocked=false;touch(j);renderDetail()}break;
    case 'unsign':
      if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Click again to remove';setTimeout(function(){b.dataset.armed='';b.textContent='Remove signature'},4000)}
      else if(j){j.signedAt='';j.signedBy='';j.signDate='';j.unlocked=false;touch(j);renderList();renderDetail()}
      break;
    case 'req-create':var rq=requests.get(b.dataset.id);if(rq){
      createJobFrom({name:rq.name,phone:rq.phone,area:rq.area,prop:rq.prop,needs:(rq.needs||[]).filter(function(n){return INTERESTS.indexOf(n)>-1}),windows:rq.windows,visit:reqVisit(rq),notes:rq.notes});
      requests.delete(rq.id);if(db)db.collection('requests').doc(rq.id).delete().catch(function(){setSave('error')});
      setTab('jobs');renderAll();
    }break;
    case 'req-dismiss':requests.delete(b.dataset.id);if(db)db.collection('requests').doc(b.dataset.id).delete().catch(function(){setSave('error')});renderReqs();break;
    case 'toggle-import':var ip=$('#importpanel');ip.hidden=!ip.hidden;$('#importmsg').textContent='';if(!ip.hidden)$('#importtext').focus();break;
    case 'do-import':
      if(importJob($('#importtext').value)){$('#importtext').value='';$('#importpanel').hidden=true;setTab('jobs');renderAll()}
      else{$('#importmsg').textContent='No name or phone found. Paste the whole message, including the Name: and Phone: lines.'}
      break;
    case 'add-price':addPrice();break;
    case 'rm-price':var tr=b.closest('tr'),pid=tr.dataset.id;prices.delete(pid);saving.delete('prices/'+pid);if(db)db.collection('prices').doc(pid).delete().catch(function(){setSave('error')});renderPrices();if(j)refreshCalc(j);break;
  }
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='search'){q=t.value.trim();renderList();return}
  var j=sel&&jobs.get(sel);if(!j||!$('#detail').contains(t))return;
  if(t.dataset.f){
    var f=t.dataset.f;
    j[f]=(f==='discount'||f==='deposit'||f==='changeFee')?num(t.value):t.value;
    touch(j);
    if(f==='discount')refreshCalc(j);
    if(f==='name'||f==='phone'||f==='area'||f==='apptAt'||f==='visit')renderList();
    if(f==='name'||f==='discount'||f==='deposit'||f==='changeFee')refreshCalc(j);
    renderedJson=JSON.stringify(j);
  }else if(t.dataset.lf){
    var row=t.closest('.line'),l=j.lines.find(function(x){return x.id===row.dataset.line});if(!l)return;
    var k=t.dataset.lf;
    l[k]=(k==='w'||k==='h'||k==='qty')?num(t.value):t.value;
    touch(j);refreshCalc(j);renderList();
    renderedJson=JSON.stringify(j);
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.sf){saveSetting(t.dataset.sf,t.type==='checkbox'?t.checked:t.value);return}
  if(!t.dataset.pf)return;
  var id=t.closest('tr').dataset.id,p=prices.get(id);if(!p)return;
  var k=t.dataset.pf;
  p[k]=(k==='rate'||k==='min')?num(t.value):t.value;
  p.example=false;
  queueSave('prices',id,0);
  renderPrices();
  var j=sel&&jobs.get(sel);if(j)refreshCalc(j);
  renderList();
});

/* ---------- spreadsheet export (CSV opens in Excel and Google Sheets) ---------- */
function csvCell(v){
  var t=v==null?'':String(v);
  if(typeof v==='number'&&isFinite(v))return String(v);
  /* a cell that starts like a formula would run in Excel, so mark it as text */
  if(/^[=@\t\r]/.test(t)||/^[+-][^0-9 ()\-.]/.test(t))t="'"+t;
  return '"'+t.replace(/"/g,'""')+'"';
}
function csvText(head,rows){
  return '\uFEFF'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n')+'\r\n';
}
function sortedJobs(){return Array.from(jobs.values()).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)})}
function dateText(ms){return ms?ymd(new Date(ms)):''}
function jobsCsv(){
  var head=['Created','Customer','Phone','Email','Area','How they reached us','Stage','Interested in','Visit type','Visit date and time','Notes','Windows and items','Subtotal (AED)','Discount (AED)','VAT (AED)','Total (AED)','Deposit (AED)','Balance due (AED)','Invoice no.','Invoice date','Signed by','Signed on','Change fee (AED)','What was changed after signing'];
  var rows=sortedJobs().map(function(j){
    var t=totals(j),has=invoiceReady(j);
    return [dateText(j.createdAt),j.name||'',j.phone||'',j.email||'',j.area||'',j.source||'',(STAGE[j.stage]||STAGE.enquiry).label,(j.interest||[]).join(', '),j.visit||'',j.apptAt||'',j.notes||'',(j.lines||[]).length,t.sub,t.disc,t.vat,t.total,num(j.deposit),has?dueOf(j):'',has?(j.invoiceNo||''):'',has?(j.invoiceDate||''):'',j.signedAt?(j.signedBy||''):'',j.signedAt||'',t.fee,j.changeNote||''];
  });
  return csvText(head,rows);
}
function itemsCsv(){
  var head=['Customer','Phone','Stage','Room or window','Item','Category','Width (cm)','Drop (cm)','Qty','Amount (AED)'];
  var rows=[];
  sortedJobs().forEach(function(j){
    (j.lines||[]).forEach(function(l){
      var p=prices.get(l.priceId);
      rows.push([j.name||'',j.phone||'',(STAGE[j.stage]||STAGE.enquiry).label,l.room||'',p?p.name:'(item removed)',p?(p.category||''):'',num(l.w),num(l.h),num(l.qty)||1,lineAmount(l)]);
    });
  });
  return csvText(head,rows);
}
function saveCsv(name,text){
  if(!dl)return Promise.reject({code:'unavailable'});
  return dl.save({filename:name+'-'+ymd(new Date())+'.csv',data:text});
}
window.NookExport={
  jobs:function(){return saveCsv('nook-jobs',jobsCsv())},
  items:function(){return saveCsv('nook-items',itemsCsv())}
};

/* ---------- boot ---------- */
setSave('idle');
renderAll();
(async function(){
  var c=window.claude;
  if(!c||!c.use){localMode=true;loaded.jobs=loaded.prices=true;renderAll();setSave('local');return}
  var d=null,u=null;
  try{d=await c.use('db');u=await c.use('user')}catch(_){}
  try{dl=await c.use('downloads')}catch(_){}
  if(!d){localMode=true;loaded.jobs=loaded.prices=true;renderAll();setSave('local');return}
  db=d;
  if(u){
    try{canPrice=await u.canEdit();var w=await u.can('data.write');RO=(w===false)}catch(_){}
  }else{canPrice=false}
  renderAll();
  var onErr=function(e){dbError=(e&&e.code)||'unavailable';renderBanner()};
  db.collection('jobs').onSnapshot(function(s){applySnap('jobs',s)},onErr);
  db.collection('prices').onSnapshot(function(s){applySnap('prices',s)},onErr);
  db.collection('requests').onSnapshot(function(s){applySnap('requests',s)},onErr);
  db.doc('settings/invoice').onSnapshot(function(s){
    if(s.exists){var v=s.data()||{};var pv=settings.vat;settings={trn:String(v.trn||''),terms:String(v.terms||''),vat:v.vat!==false,conditions:String(v.conditions||'')};if(pv!==settings.vat){renderDetail();renderList()}}
    if(tab==='prices'){var a=document.activeElement;if(!(a&&$('#view-prices').contains(a)))renderPrices()}
  },onErr);
})();
})();
</script>
